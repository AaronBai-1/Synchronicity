[project]
name = "synchronicity-workspace"
version = "0.0.0"
description = "Badminton analytics platform — workspace root (not an installable package)"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["pipeline", "api"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "api/tests"]
addopts = "-q"
