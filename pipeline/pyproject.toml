[project]
name = "synchro-pipeline"
version = "0.1.0"
description = "Badminton analytics CV/ML pipeline: stages S0-S7, schema contracts, eval harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "scenedetect>=0.6.4",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Heavy ML deps are opt-in: `uv sync --all-packages --extra ml`
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
]
cloud = [
    "modal>=0.64",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synchro_pipeline"]
