[project]
name = "synchro-api"
version = "0.1.0"
description = "Badminton analytics API: matches/rallies/shots over Postgres (SQLite in dev)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
    "synchro-pipeline",
]

[tool.uv.sources]
synchro-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synchro_api"]
